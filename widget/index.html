<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee</title>
<style>
  :root {
    --bg: #07080c;
    --panel: #11141c;
    --panel2: #171b26;
    --line: #232838;
    --text: #e9ecf4;
    --dim: #8a91a6;
    --accent1: #ff2a8a;
    --accent2: #00e5ff;
    --good: #2bff6a;
    --bad: #ff3b4e;
  }
  * { box-sizing: border-box; }
  html { scrollbar-width: thin; scrollbar-color: #2f3750 transparent; overflow-x: hidden; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  /* The whole page is scaled with CSS zoom so each view fits its window with no scrolling. */
  .wrap { padding: 18px 22px 10px; margin: 0 auto; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0 20px; }
  .stage, .controls { min-width: 0; }
  /* Landscape windows: preview and message on the left, controls on the right. */
  body.wide.v-full .layout { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
  body.wide.v-full .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  body.wide.v-full .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* Message view: just the screen, the message box, and emoji. */
  body.v-compact .controls, body.v-compact #presets, body.v-compact .bezel .tag { display: none; }
  body.v-compact .emojis { margin-bottom: 0; }
  /* Screen view: only the LED screen, with the view buttons on hover. */
  body.v-screen { overflow: hidden; }
  body.v-screen .wrap { padding: 6px; height: 100vh; display: flex; align-items: center; justify-content: center; }
  body.v-screen .layout, body.v-screen .stage { width: 100%; }
  body.v-screen .compose, body.v-screen .emojis, body.v-screen #presets, body.v-screen .controls, body.v-screen .bezel .tag { display: none; }
  body.v-screen .bezel { padding: 6px; border-radius: 12px; }
  body.v-screen .bezel canvas { width: min(100%, calc((100vh - 26px) * 4.5)); border-radius: 6px; }
  body.v-screen header { position: fixed; top: 8px; right: 10px; z-index: 5; margin: 0; opacity: 0; transition: opacity .15s; }
  body.v-screen:hover header { opacity: 1; }
  body.v-screen .brand, body.v-screen .status { display: none; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .hright { display: flex; align-items: center; gap: 10px; }
  .views { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: #0b0d13e6; }
  .views button { display: grid; place-items: center; width: 28px; height: 24px; border: 0; border-radius: 999px; background: none; color: var(--dim); }
  .views button:hover { color: var(--text); background: var(--panel2); }
  .views button.on { color: var(--text); background: linear-gradient(135deg, #ff2a8a44, #00e5ff44); }
  .views svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .views .sep { width: 1px; margin: 4px 3px; background: var(--line); }
  .pin { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 14px; width: min(560px, calc(100vw - 24px)); padding: 12px 14px; border-radius: 14px; background: #161a26; border: 1px solid #2f3750; box-shadow: 0 18px 50px -12px #000; }
  .pin[hidden] { display: none; }
  .pin .msg { flex: 1; font-size: 13px; color: var(--dim); }
  .pin .msg b { display: block; color: var(--text); font-size: 14px; margin-bottom: 2px; }
  .pin .send { padding: 9px 14px; font-size: 12px; }
  .brand { font-weight: 800; letter-spacing: .18em; font-size: 13px; background: linear-gradient(90deg, var(--accent1), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; box-shadow: 0 0 0 0 transparent; }
  .dot.on { background: var(--good); box-shadow: 0 0 10px var(--good); }
  .dot.off { background: var(--bad); box-shadow: 0 0 10px var(--bad); }

  .bezel { position: relative; padding: clamp(8px, 1.4vw, 14px); border-radius: 18px; background: linear-gradient(180deg, #1b1f2a, #0c0e14); border: 1px solid #2a3042; box-shadow: 0 20px 60px -20px #000, inset 0 1px 0 #ffffff10; }
  /* Keep the 72:16 screen proportions and never let it eat more than ~42% of the window height. */
  .bezel canvas { display: block; width: 100%; aspect-ratio: 72 / 16; height: auto; margin: 0 auto; border-radius: 8px; background: #030405; }
  .bezel .tag { position: absolute; right: 22px; bottom: 4px; font-size: 10px; letter-spacing: .2em; color: #ffffff30; }

  .compose { display: flex; gap: 10px; margin: 16px 0 10px; }
  .compose input { flex: 1; min-width: 0; font-size: 20px; font-weight: 600; letter-spacing: .02em; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); outline: none; }
  .compose input:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px #00e5ff22; }
  button { font: inherit; color: var(--text); cursor: pointer; }
  .send { border: 0; border-radius: 12px; padding: 0 20px; font-weight: 800; letter-spacing: .06em; background: linear-gradient(135deg, var(--accent1), #8a3cff 55%, var(--accent2)); box-shadow: 0 8px 24px -8px #ff2a8a88; white-space: nowrap; }
  .send:active { transform: translateY(1px); }
  .send:disabled { opacity: .5; cursor: progress; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; letter-spacing: .04em; display: inline-flex; gap: 6px; align-items: center; }
  .chip:hover { border-color: #3a4260; background: var(--panel2); }
  .chip .x { color: var(--dim); font-weight: 400; }
  .chip.save { border-style: dashed; color: var(--dim); }
  .emojis { display: flex; flex-wrap: wrap; gap: 2px; margin: -6px 0 10px; }
  .emojis button { font-size: 18px; line-height: 1; background: none; border: 0; padding: 4px; border-radius: 8px; cursor: pointer; }
  .emojis button:hover { background: var(--panel2); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .18em; color: var(--dim); font-weight: 700; text-transform: uppercase; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .tile { position: relative; border: 1px solid var(--line); border-radius: 10px; padding: 0; overflow: hidden; background: #030405; }
  .tile canvas { display: block; width: 100%; height: auto; aspect-ratio: 72 / 16; image-rendering: pixelated; }
  .tile span { position: absolute; left: 8px; bottom: 5px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
  .tile.on { border-color: var(--accent2); box-shadow: 0 0 0 2px #00e5ff55, 0 0 18px #00e5ff33; }

  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--panel2); border-radius: 9px; padding: 7px 11px; font-size: 12px; font-weight: 600; }
  .seg button.on { border-color: transparent; background: linear-gradient(135deg, #ff2a8a33, #00e5ff33); box-shadow: inset 0 0 0 1px #00e5ff99; }

  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
  .row label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
  input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: none; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 5px; }
  input[type=range] { width: 150px; accent-color: var(--accent2); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); cursor: pointer; user-select: none; }
  .toggle input { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: #2a3042; position: relative; cursor: pointer; transition: background .15s; }
  .toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #cfd5e6; transition: left .15s; }
  .toggle input:checked { background: linear-gradient(90deg, var(--accent1), var(--accent2)); }
  .toggle input:checked::after { left: 17px; background: #fff; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 12px; }
  @media (max-width: 520px) {
    .compose input { font-size: 16px; padding: 10px 12px; }
    .send { padding: 0 14px; }
    .bezel .tag { display: none; }
  }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
  .ghost { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 7px 12px; font-size: 12px; color: var(--dim); }
  .ghost:hover { color: var(--text); border-color: #3a4260; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; background: #1d2333; border: 1px solid #2f3750; padding: 9px 14px; border-radius: 10px; font-size: 13px; transition: all .2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { border-color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">MARQUEE</div>
  <div class="hright">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting...</span></div>
    <div class="views" id="views">
      <button data-view="full" title="All controls"><svg viewBox="0 0 16 16"><rect x="1.5" y="2" width="13" height="12" rx="2"/><path d="M1.5 6.5h13M8 6.5V14"/></svg></button>
      <button data-view="compact" title="Screen and message box"><svg viewBox="0 0 16 16"><rect x="1.5" y="2" width="13" height="6" rx="1.5"/><path d="M2 11.5h12M2 14h7"/></svg></button>
      <button data-view="screen" title="Screen only"><svg viewBox="0 0 16 16"><rect x="1.5" y="4.5" width="13" height="7" rx="1.5"/></svg></button>
      <span class="sep host-only"></span>
      <button id="ontop" class="host-only" title="Keep on top of other windows"><svg viewBox="0 0 16 16"><path d="M10 1.8 14.2 6l-2 .6-2.6 2.6.3 3.2-1.3 1.3L5.8 10.9 2 14.7M5.1 3.5l7.4 7.4M9.5 1.5 6 5l-2.7.2L2 6.5"/></svg></button>
    </div>
  </div>
</header>

<div class="layout">
<section class="stage">
<div class="bezel">
  <canvas id="led" width="720" height="160"></canvas>
  <div class="tag">BUSY BAR - FRONT</div>
</div>

<div class="compose">
  <input id="text" maxlength="200" placeholder="Type a message for the door..." autocomplete="off" spellcheck="false">
  <button class="send" id="send">SEND</button>
</div>
<div class="emojis" id="emojis"></div>
<div class="chips" id="presets"></div>
</section>

<section class="controls">
<div class="card">
  <h2>Background</h2>
  <div class="tiles" id="tiles"></div>
  <div class="row">
    <label>Brightness <input type="range" id="bg_level" min="0" max="100" step="5"></label>
    <label>Tint <input type="color" id="bg_color"></label>
    <span style="font-size:11px;color:var(--dim)">Tint applies to Warp, Sparkle and Solid.</span>
  </div>
</div>

<div class="two">
  <div class="card">
    <h2>Text style</h2>
    <div class="seg" id="text_fx"></div>
    <div class="row">
      <label>Color <input type="color" id="color"></label>
      <label>Second color <input type="color" id="color2"></label>
    </div>
    <div class="row">
      <div class="seg" id="size"></div>
      <label class="toggle"><input type="checkbox" id="outline"> Outline</label>
    </div>
  </div>
  <div class="card">
    <h2>Motion</h2>
    <div class="seg" id="motion"></div>
    <div class="row">
      <label>Speed <input type="range" id="speed" min="1" max="10" step="1"></label>
    </div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="alert"> Flash on new message</label>
    </div>
  </div>
</div>

<footer>
  <label class="toggle"><input type="checkbox" id="live"> Live: send every change as you tweak</label>
  <button class="ghost" id="stop">Stop Marquee</button>
</footer>
</section>
</div>
</div>
<div class="toast" id="toast"></div>
<div class="pin" id="pin" hidden>
  <div class="msg" id="pinMsg"><b>Keep Marquee on your taskbar?</b>Then it's one click away whenever you want to change the sign.</div>
  <button class="send" id="pinYes">Show me how</button>
  <button class="ghost" id="pinNo">No thanks</button>
</div>

<script type="module">
import { Renderer, W, H } from "/fx.js";
import { EMOJI, toCodes, fromCodes } from "/emoji.js";

const BGS = [
  ["plasma", "Plasma"], ["fire", "Fire"], ["matrix", "Matrix"], ["warp", "Warp"], ["rainbow", "Rainbow"],
  ["aurora", "Aurora"], ["sparkle", "Sparkle"], ["solid", "Solid"], ["none", "None"],
];
const TEXT_FX = [["solid", "Solid"], ["chrome", "Chrome"], ["rainbow", "Rainbow"], ["gradient", "Gradient"], ["fire", "Fire"]];
const MOTIONS = [["scroll", "Scroll"], ["wave", "Wave"], ["static", "Still"], ["blink", "Blink"], ["glitch", "Glitch"], ["typewriter", "Typewriter"]];
const SIZES = [["normal", "Normal"], ["big", "Big"]];

const DEFAULTS = {
  text: "WELCOME IN", color: "#FFFFFF", color2: "#00E5FF", text_fx: "chrome", motion: "scroll",
  size: "normal", speed: 5, bg: "plasma", bg_color: "#FF2A3C", bg_level: 45, outline: true, alert: true,
};
const BUILT_IN = [
  { name: "Come in", look: { text: "COME IN", size: "big", motion: "static", text_fx: "solid", color: "#2BFF6A", bg: "aurora", bg_level: 55, outline: true } },
  { name: "In a meeting", look: { text: "IN A MEETING", size: "normal", motion: "static", text_fx: "solid", color: "#FF2A3C", bg: "solid", bg_color: "#FF2A3C", bg_level: 18, outline: true } },
  { name: "Do not disturb", look: { text: "DO NOT DISTURB", size: "normal", motion: "glitch", text_fx: "solid", color: "#FF2A3C", bg: "none", outline: false } },
  { name: "On a call", look: { text: "ON A CALL", size: "big", motion: "static", text_fx: "gradient", color: "#FFFFFF", color2: "#40A0FF", bg: "warp", bg_color: "#4080FF", bg_level: 80 } },
  { name: "Back in 10", look: { text: "Back in 10 minutes", size: "normal", motion: "typewriter", text_fx: "solid", color: "#B0FFC0", bg: "matrix", bg_level: 60, speed: 5 } },
  { name: "Payday", look: { text: "PAYDAY", size: "big", motion: "static", text_fx: "rainbow", bg: "sparkle", bg_color: "#FFD040", bg_level: 80 } },
  { name: "On fire", look: { text: "WE'RE ON FIRE", size: "normal", motion: "wave", text_fx: "solid", color: "#FFFFFF", bg: "fire", bg_level: 70, outline: true } },
  { name: "Welcome", look: { ...DEFAULTS } },
];

const $ = (id) => document.getElementById(id);
let state = { ...DEFAULTS };
try { Object.assign(state, JSON.parse(localStorage.getItem("marquee.look") || "{}")); } catch {}

const toRenderer = (s) => ({
  text: toCodes(s.text || "") || " ", color: s.color, color2: s.color2, textFx: s.text_fx, motion: s.motion, size: s.size,
  speed: s.speed, bg: s.bg, bgColor: s.bg_color, bgLevel: s.bg_level, outline: s.outline,
});

// ---- LED drawing ----------------------------------------------------------------
const main = new Renderer(toRenderer(state));
const led = $("led");
const lctx = led.getContext("2d");
const dots = document.createElement("canvas");
const dctx = dots.getContext("2d");
let P = 10; // dot pitch in device pixels

// Match the canvas to its on-screen size so the dots stay crisp at any window size and display scale.
function fit() {
  // The on-screen width, after the page zoom, in device pixels.
  const w = Math.max(W, Math.round(led.getBoundingClientRect().width * (window.devicePixelRatio || 1)));
  if (w === led.width) return;
  P = w / W;
  led.width = dots.width = w;
  led.height = dots.height = Math.round(P * H);
}
new ResizeObserver(fit).observe(led);
fit();

function drawLed(r, ctx, pitch, round) {
  const fb = r.fb;
  ctx.fillStyle = "#030405";
  ctx.fillRect(0, 0, W * pitch, H * pitch);
  const rad = pitch * 0.38;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = r.color(fb[y * W + x]);
      ctx.fillStyle = c || "#101218";
      if (round) {
        ctx.beginPath();
        ctx.arc(x * pitch + pitch / 2, y * pitch + pitch / 2, rad, 0, 6.2832);
        ctx.fill();
      } else {
        ctx.fillRect(x * pitch + 0.25, y * pitch + 0.25, pitch - 0.5, pitch - 0.5);
      }
    }
  }
}

// ---- Background tiles, each a live mini renderer ----------------------------------
const tiles = BGS.map(([bg, label]) => {
  const btn = document.createElement("button");
  btn.className = "tile";
  const c = document.createElement("canvas");
  c.width = 216; c.height = 48;
  btn.append(c);
  const span = document.createElement("span");
  span.textContent = label;
  btn.append(span);
  btn.onclick = () => change({ bg, bg_level: state.bg_level || 45 });
  $("tiles").append(btn);
  const r = new Renderer({ text: " ", bg, bgLevel: 70, bgColor: state.bg_color, outline: false });
  return { bg, btn, r, ctx: c.getContext("2d") };
});

function segmented(id, options, key) {
  const el = $(id);
  for (const [value, label] of options) {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.value = value;
    b.onclick = () => change({ [key]: value });
    el.append(b);
  }
}
segmented("text_fx", TEXT_FX, "text_fx");
segmented("motion", MOTIONS, "motion");
segmented("size", SIZES, "size");

// ---- State <-> controls ------------------------------------------------------------
function render() {
  $("text").value !== state.text && document.activeElement !== $("text") && ($("text").value = state.text);
  for (const k of ["color", "color2", "bg_color"]) $(k).value = state[k];
  $("bg_level").value = state.bg_level;
  $("speed").value = state.speed;
  $("outline").checked = state.outline;
  $("alert").checked = state.alert;
  for (const id of ["text_fx", "motion", "size"]) {
    for (const b of $(id).children) b.classList.toggle("on", b.dataset.value === state[id]);
  }
  for (const t of tiles) t.btn.classList.toggle("on", t.bg === state.bg);
  const tc = state.text_fx === "gradient";
  $("color2").parentElement.style.opacity = tc ? 1 : 0.4;
}

let liveTimer = 0;
function change(patch, fromInput = false) {
  Object.assign(state, patch);
  main.set(toRenderer(state));
  if ("bg_color" in patch) for (const t of tiles) t.r.set({ text: " ", bg: t.bg, bgLevel: 70, bgColor: state.bg_color, outline: false });
  try { localStorage.setItem("marquee.look", JSON.stringify(state)); } catch {}
  if (!fromInput) render();
  if ($("live").checked) {
    clearTimeout(liveTimer);
    liveTimer = setTimeout(() => push(false), 600);
  }
}

$("text").addEventListener("input", (e) => change({ text: e.target.value }, true));
$("text").addEventListener("keydown", (e) => { if (e.key === "Enter") push(true); });
for (const k of ["color", "color2", "bg_color"]) $(k).addEventListener("input", (e) => change({ [k]: e.target.value.toUpperCase() }));
for (const k of ["bg_level", "speed"]) $(k).addEventListener("input", (e) => change({ [k]: Number(e.target.value) }));
for (const k of ["outline", "alert"]) $(k).addEventListener("change", (e) => change({ [k]: e.target.checked }));
$("send").onclick = () => push(true);
// Emoji picker: inserts at the cursor. The bar draws these as pixel art.
for (const e of EMOJI) {
  const b = document.createElement("button");
  const ch = String.fromCodePoint(e.u[0]);
  b.textContent = ch;
  b.title = e.name;
  b.onclick = () => {
    const el = $("text");
    const a = el.selectionStart ?? el.value.length;
    const z = el.selectionEnd ?? a;
    el.value = el.value.slice(0, a) + ch + el.value.slice(z);
    el.focus();
    el.setSelectionRange(a + ch.length, a + ch.length);
    change({ text: el.value }, true);
  };
  $("emojis").append(b);
}
$("stop").onclick = async () => {
  const r = await fetch("/api/stop", { method: "POST" }).then((r) => r.json()).catch((e) => ({ error: String(e) }));
  toast(r.ok ? "Marquee stopped" : `Couldn't stop: ${r.error}`, !r.ok);
};

// ---- Presets --------------------------------------------------------------------------
function loadCustom() {
  try { return JSON.parse(localStorage.getItem("marquee.presets") || "[]"); } catch { return []; }
}
function drawPresets() {
  const el = $("presets");
  el.textContent = "";
  const custom = loadCustom();
  const all = [...BUILT_IN.map((p) => ({ ...p, builtIn: true })), ...custom];
  for (const p of all) {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = p.name;
    b.title = p.look.text;
    b.onclick = () => { change({ ...DEFAULTS, ...p.look, alert: state.alert }); push(true); };
    if (!p.builtIn) {
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = "x";
      x.title = "Remove preset";
      x.onclick = (e) => {
        e.stopPropagation();
        localStorage.setItem("marquee.presets", JSON.stringify(loadCustom().filter((q) => q.name !== p.name)));
        drawPresets();
      };
      b.append(x);
    }
    el.append(b);
  }
  const save = document.createElement("button");
  save.className = "chip save";
  save.textContent = "+ Save current";
  save.onclick = () => {
    const name = (state.text || "Preset").slice(0, 18);
    const list = loadCustom().filter((q) => q.name !== name);
    list.push({ name, look: { ...state } });
    localStorage.setItem("marquee.presets", JSON.stringify(list));
    drawPresets();
    toast(`Saved "${name}"`);
  };
  el.append(save);
  // Presets can wrap onto another row, so refit.
  requestAnimationFrame(() => fitView());
}

// ---- Bar I/O -------------------------------------------------------------------------
let sending = false;
async function push(launch) {
  if (sending && !launch) return;
  sending = true;
  $("send").disabled = launch;
  try {
    const r = await fetch("/api/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ values: { ...state, text: toCodes(state.text) }, launch }),
    }).then((r) => r.json());
    if (!r.ok) throw new Error(r.error);
    if (launch) toast("Sent to BUSY Bar");
    setStatus(true);
  } catch (err) {
    toast(`Couldn't reach the bar: ${err.message}`, true);
    setStatus(false);
  } finally {
    sending = false;
    $("send").disabled = false;
  }
}

let addr = "";
function setStatus(ok, text) {
  $("dot").className = `dot ${ok ? "on" : "off"}`;
  $("statusText").textContent = text || (ok ? `Connected - ${addr}` : `Bar not reachable - ${addr}`);
}

let first = true;
async function poll() {
  try {
    const s = await fetch("/api/state").then((r) => r.json());
    addr = s.addr;
    setStatus(s.connected);
    // On open, start from what the bar is showing now.
    if (first && s.connected && s.values && Object.keys(s.values).length) {
      Object.assign(state, s.values, { text: fromCodes(String(s.values.text ?? "")) });
      main.set(toRenderer(state));
      $("text").value = state.text;
      render();
    }
    first = false;
  } catch {
    setStatus(false, "Widget server stopped - close and reopen Marquee");
  }
}

let toastTimer = 0;
function toast(msg, err = false) {
  const t = $("toast");
  t.textContent = msg;
  t.className = `toast show${err ? " err" : ""}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = "toast"), 2200);
}

// ---- Animation loop at the bar's 15 fps ----------------------------------------------------
function frame() {
  main.step();
  drawLed(main, dctx, P, true);
  lctx.clearRect(0, 0, led.width, led.height);
  lctx.filter = `blur(${Math.max(2, P * 0.8)}px)`;
  lctx.globalAlpha = 0.7;
  lctx.drawImage(dots, 0, 0);
  lctx.filter = "none";
  lctx.globalAlpha = 1;
  lctx.globalCompositeOperation = "lighter";
  lctx.drawImage(dots, 0, 0);
  lctx.globalCompositeOperation = "source-over";
  for (const t of tiles) {
    t.r.step();
    drawLed(t.r, t.ctx, 3, false);
  }
}
setInterval(frame, 66);

// ---- Views and fitting -------------------------------------------------------------------
// Marquee.exe hosts this page in WebView2 and resizes its window per view; in a browser the
// page just adapts to whatever window it gets.
const host = window.chrome?.webview;
const wrap = document.querySelector(".wrap");
let view = "full";
try { view = localStorage.getItem("marquee.view") || "full"; } catch {}

/** Scales the page so the current view fills the window with no scrolling. */
function fitView() {
  document.body.classList.toggle("wide", innerWidth / innerHeight > 1.25 && innerWidth > 820);
  const root = document.documentElement.style;
  // No scrollbar while measuring: one would narrow the page and throw the measurements off.
  root.overflowY = "hidden";
  wrap.style.zoom = "1";
  if (view !== "screen") {
    // Zoom changes the layout width, which changes the height, so search for the largest zoom
    // whose height still fits the window.
    const fits = (z) => {
      wrap.style.zoom = String(z);
      return wrap.getBoundingClientRect().height <= innerHeight - 1;
    };
    let lo = 0.45;
    let hi = view === "full" ? 1.4 : 1;
    if (fits(hi)) lo = hi;
    else for (let i = 0; i < 9; i++) {
      const mid = (lo + hi) / 2;
      if (fits(mid)) lo = mid;
      else hi = mid;
    }
    wrap.style.zoom = String(lo);
    // Only a window too small for even the smallest zoom gets a scrollbar.
    if (wrap.getBoundingClientRect().height > innerHeight) root.overflowY = "auto";
  }
  fit();
}

/** Natural size of a view in CSS pixels, so the window can open at a size that suits it. */
function suggestedSize(v) {
  if (v === "screen") return { w: 560, h: Math.round((560 - 24) / 4.5 + 24) };
  if (v === "compact") return { w: 760, h: 0 };
  return { w: 1240, h: 800 };
}

function setView(v, fromHost = false) {
  view = ["full", "compact", "screen"].includes(v) ? v : "full";
  document.body.className = document.body.className.replace(/\bv-\w+/g, "").trim() + ` v-${view}`;
  for (const b of $("views").querySelectorAll("[data-view]")) b.classList.toggle("on", b.dataset.view === view);
  try { localStorage.setItem("marquee.view", view); } catch {}
  if (host && !fromHost) host.postMessage({ type: "view", view, ...suggestedSize(view) });
  requestAnimationFrame(fitView);
}
for (const b of $("views").querySelectorAll("[data-view]")) b.onclick = () => setView(b.dataset.view);
$("led").addEventListener("dblclick", () => setView(view === "screen" ? "full" : "screen"));
addEventListener("resize", () => requestAnimationFrame(fitView));
// Refit once fonts (and emoji) finish loading, since they change the layout.
document.fonts?.ready.then(() => requestAnimationFrame(fitView));

// ---- Marquee.exe extras: always on top, and a one-time offer to pin to the taskbar -------
for (const el of document.querySelectorAll(".host-only")) el.hidden = !host;
let onTop = false;
$("ontop").onclick = () => {
  onTop = !onTop;
  $("ontop").classList.toggle("on", onTop);
  host?.postMessage({ type: "topmost", on: onTop });
  toast(onTop ? "Marquee stays on top" : "Marquee no longer stays on top");
};
const pinMsg = (title, body) => { $("pinMsg").innerHTML = `<b>${title}</b>${body}`; };
$("pinYes").onclick = () => {
  host?.postMessage({ type: "pin", action: "show" });
  pinMsg("Right-click the flashing Marquee icon on your taskbar", "Then choose <b style=\"display:inline\">Pin to taskbar</b>.");
  $("pinYes").hidden = true;
  $("pinNo").textContent = "Done";
  $("pinNo").onclick = () => ($("pin").hidden = true);
};
$("pinNo").onclick = () => {
  host?.postMessage({ type: "pin", action: "decline" });
  $("pin").hidden = true;
};
host?.addEventListener("message", (e) => {
  const m = e.data || {};
  if (m.type === "init") {
    setView(m.view || view, true);
    onTop = !!m.topmost;
    $("ontop").classList.toggle("on", onTop);
    if (m.askPin) setTimeout(() => ($("pin").hidden = false), 1200);
  } else if (m.type === "placed" && m.view === "compact" && view === "compact") {
    // The window has its new width; the message view's height depends on it.
    requestAnimationFrame(() => {
      wrap.style.zoom = "1";
      host.postMessage({ type: "fitHeight", h: Math.ceil(wrap.getBoundingClientRect().height) });
      fitView();
    });
  } else if (m.type === "pinned") {
    pinMsg("Pinned", "Marquee is on your taskbar now.");
    $("pinYes").hidden = true;
    $("pinNo").hidden = true;
    setTimeout(() => ($("pin").hidden = true), 2500);
  }
});

setView(view, true);
host?.postMessage({ type: "hello" });
render();
drawPresets();
poll();
setInterval(poll, 5000);
// Keeps the Node widget server running while this window is open, even when minimized.
if (!host) new EventSource("/api/alive");
$("text").focus();
requestAnimationFrame(fitView);
</script>
</body>
</html>
