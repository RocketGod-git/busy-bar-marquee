# Push a tag like v1.0.0 to build Marquee and publish a release with the installable
# .tgz package and a zip of the desktop widget attached.
name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build the app
        run: |
          mkdir -p release
          cd marquee
          npm ci
          npm run typecheck
          npm run build -- --tgz-name "{id}-{version}.tgz"
          cp dist/*.tgz ../release/

      - name: Package the widget
        run: |
          # The widget serves the Marquee renderer straight from marquee/src, so ship both.
          zip -r release/marquee-widget.zip widget marquee/src/fx.ts marquee/src/font.ts marquee/src/appmeta/manifest.json -x "widget/config.json"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
