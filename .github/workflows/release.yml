# Push a tag like v1.0.0 to build Marquee and publish a release with Marquee.exe (the Windows
# app, which carries the bar app inside and installs it with one click), the bar app's .tgz
# package, and a zip of the desktop widget for Mac and Linux.
name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  bar-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build the bar app
        run: |
          cd marquee
          npm ci
          npm run typecheck
          npm run build -- --tgz-name "{id}-{version}.tgz"
      - uses: actions/upload-artifact@v5
        with:
          name: bar-app
          path: marquee/dist/*.tgz

  exe:
    needs: bar-app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v5
        with:
          name: bar-app
          path: marquee/dist
      - name: Build Marquee.exe
        # Self-contained, so it runs on any 64-bit Windows PC with nothing else to install.
        run: dotnet publish widget/app/Marquee.csproj -c Release --self-contained true -p:EnableCompressionInSingleFile=true -o out
      - name: Check the bar app is inside
        shell: pwsh
        run: if (-not (Test-Path widget/app/payload/marquee.tgz)) { throw "Marquee.exe was built without the bar app" }
      - uses: actions/upload-artifact@v5
        with:
          name: exe
          path: out/Marquee.exe

  release:
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: bar-app
          path: release
      - uses: actions/download-artifact@v5
        with:
          name: exe
          path: release

      - name: Package the widget
        run: |
          # The widget serves the Marquee renderer straight from marquee/src, so ship both, plus the
          # bar app so the widget can install it with one click.
          cp release/*.tgz widget/marquee.tgz
          zip -r release/marquee-widget-mac-linux.zip widget marquee/src/fx.ts marquee/src/font.ts marquee/src/emoji.ts marquee/src/appmeta/manifest.json -x "widget/config.json" "widget/app/*"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            # Install steps for newcomers, then what's new from the tag message.
            version="${GITHUB_REF_NAME#v}"
            sed "s/VERSION/$version/g" .github/release-notes.md > notes.md
            git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            news="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
            if [ -n "$news" ]; then printf "\n## What's new\n\n%s\n" "$news" >> notes.md; fi
            gh release create "$GITHUB_REF_NAME" release/* --title "Marquee $version" --notes-file notes.md
          fi
